---
steps:
  - title: "Navigate to Datacentre"
    action: "Select storage"
    commands:
      - "remove storage 'local-lvm'"

  - title: "Navigate to Proxmox Node"
    action: "Select shell"
    commands:
      - "lvremove /dev/pve/data"
      - "lvresize -l +100%FREE /dev/pve/root"
      - "resize2fs /dev/mapper/pve/root"
